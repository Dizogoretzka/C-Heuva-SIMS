{% extends "main_app/base.html" %}

{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<section class="content">
    <div class="container-fluid">
        <div class="card card-primary">
            <div class="card-header"><h3 class="card-title">School Profile</h3></div>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="card-body">
                    {% if profile.logo %}
                    <p><img src="{{ profile.logo.url }}" alt="Current school logo"
                            class="school-profile-logo"></p>
                    {% endif %}
                    {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}<div class="text-danger">{{ error }}</div>{% endfor %}
                    </div>
                    {% endfor %}
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-primary">Save Profile</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
